apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.App.Thwaap"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 23
        versionName "3.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.App.Thwaap'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.r0adkll:slidableactivity:2.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'
    implementation 'com.github.iammert:ScalingLayout:1.2.1'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
    implementation 'com.google.firebase:firebase-database:23.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation 'com.github.TecOrb-Developers:SmartAlertDialog:v1.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
    implementation 'androidx.work:work-runtime:2.12.0'
}
